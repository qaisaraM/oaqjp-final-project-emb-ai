<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Detector</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
  <div class="container mt-5">
    <h1>Emotion Detector</h1>
    <p>Enter a statement and the application will identify the dominant emotion.</p>
    <textarea id="textToAnalyze" class="form-control mb-3" rows="3"
              placeholder="Type your statement here"></textarea>
    <button class="btn btn-primary" onclick="RunEmotionDetection()">Run Emotion Detection</button>
    <div id="system_response" class="mt-4"></div>
  </div>
</body>
</html>
